<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <title>NextVault Password Manager</title>
  <link rel="stylesheet" href="cyber/cyber.css">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 0;
      background: var(--nv-bg);
      color: var(--nv-text);
      font-family: var(--nv-font-sans);
      font-size: 13px;
    }

    .nv-popup {
      padding: 0.85rem;
    }

    .nv-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--nv-border);
      margin-bottom: 0.75rem;
    }

    .nv-popup-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: white;
    }

    .nv-popup-title {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .nv-popup-title span {
      color: var(--nv-primary);
    }

    /* Top Tabs */
    .popup-nav {
      display: flex;
      gap: 0.25rem;
      background: var(--nv-bg-2);
      border: 1px solid var(--nv-border);
      border-radius: var(--nv-radius-sm);
      padding: 2px;
      margin-bottom: 0.85rem;
    }

    .popup-nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--nv-muted);
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .popup-nav-btn:hover {
      color: var(--nv-text);
    }

    .popup-nav-btn.active {
      color: #fff;
      background: var(--nv-surface);
      font-weight: 600;
    }

    .nv-popup-status {
      font-size: 0.72rem;
      color: var(--nv-muted);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nv-popup-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--nv-muted);
    }

    .nv-popup-status.connected {
      color: var(--nv-primary);
    }

    .nv-popup-status.connected .dot {
      background: var(--nv-primary);
    }

    .nv-popup-input, .nv-popup-textarea {
      width: 100%;
      background: var(--nv-bg-2);
      border: 1px solid var(--nv-border);
      border-radius: var(--nv-radius-sm);
      color: var(--nv-text);
      font-family: var(--nv-font-sans);
      font-size: 0.8rem;
      padding: 0.5rem 0.65rem;
      outline: none;
      margin-bottom: 0.5rem;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }

    .nv-popup-input:focus, .nv-popup-textarea:focus {
      border-color: var(--nv-primary);
      background: #0d1320;
    }

    .nv-popup-textarea {
      resize: vertical;
      min-height: 70px;
      font-family: var(--nv-font-mono);
      font-size: 0.72rem;
    }

    .nv-popup-btn {
      width: 100%;
      font-family: var(--nv-font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      color: #ffffff;
      background: var(--nv-primary);
      border: 1px solid transparent;
      border-radius: var(--nv-radius-sm);
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      margin-bottom: 0.4rem;
      transition: background 0.15s ease;
    }

    .nv-popup-btn:hover {
      background: var(--nv-primary-dim);
    }

    .nv-popup-btn.ghost {
      color: var(--nv-text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nv-border);
    }

    .nv-popup-btn.ghost:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .nv-popup-btn.danger {
      color: #ffffff;
      background: var(--nv-danger);
    }

    .nv-popup-btn.danger:hover {
      background: #dc2626;
    }

    .nv-popup-divider {
      height: 1px;
      background: var(--nv-border);
      margin: 0.6rem 0;
    }

    .nv-popup-result {
      font-family: var(--nv-font-mono);
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--nv-text);
      background: #080c14;
      border: 1px solid var(--nv-border);
      border-radius: var(--nv-radius-sm);
      padding: 0.5rem 0.65rem;
      min-height: 2.8rem;
      max-height: 6rem;
      overflow-y: auto;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .nv-popup-result .nv-dim {
      color: var(--nv-muted);
    }

    .popup-view {
      display: none;
    }

    .popup-view.active {
      display: block;
    }

    .nv-popup-hint {
      font-size: 0.65rem;
      color: var(--nv-muted);
      text-align: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="nv-popup">
    <div class="nv-popup-header">
      <div class="nv-popup-brand">
        <img src="icon.png" alt="NextVault" style="width: 20px; height: 20px; border-radius: 4px; object-fit: contain;">
        <span class="nv-popup-title">Next<span>Vault</span></span>
      </div>
      <div class="nv-popup-status" id="status" style="margin-bottom: 0;">
        <span class="dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </div>

    <!-- Top Navigation Menu -->
    <nav class="popup-nav">
      <button class="popup-nav-btn active" data-view="vault" id="nav-vault-btn">Vault</button>
      <button class="popup-nav-btn" data-view="generator" id="nav-gen-btn">Generator</button>
      <button class="popup-nav-btn" data-view="settings" id="nav-settings-btn">Settings</button>
    </nav>

    <!-- Page 1: Vault View -->
    <div id="view-vault" class="popup-view active">
      <button class="nv-popup-btn" id="connect" type="button">Connect to Desktop</button>
      <button class="nv-popup-btn ghost" id="fill-current" type="button" disabled>Autofill Current Page</button>

      <div class="nv-popup-divider"></div>

      <input class="nv-popup-input" id="search" type="text" placeholder="Search vault credentials..." disabled>
      <div class="nv-popup-result" id="result">
        <span class="nv-dim">>> Connect to the desktop vault to search</span>
      </div>
    </div>

    <!-- Page 2: Generator View -->
    <div id="view-generator" class="popup-view">
      <label style="font-size: 0.72rem; color: var(--nv-muted); margin-bottom: 0.35rem; display: block;">
        Password Length: <span id="pwd-len-val">24</span> characters
      </label>
      <input type="range" id="pwd-length-range" min="12" max="64" value="24" style="width: 100%; margin-bottom: 0.75rem;">

      <input class="nv-popup-input nv-mono" id="gen-pwd-display" readonly style="font-size: 0.85rem; font-weight: 600; text-align: center;">

      <div style="display: flex; gap: 0.4rem;">
        <button class="nv-popup-btn" id="generate-pw" type="button" style="flex: 1;">Generate New</button>
        <button class="nv-popup-btn ghost" id="copy-gen-pwd" type="button" style="flex: 1;">Copy</button>
      </div>
    </div>

    <!-- Page 3: Settings View -->
    <div id="view-settings" class="popup-view">
      <label style="font-size: 0.72rem; color: var(--nv-muted); margin-bottom: 4px; display: block;">
        Desktop Bootstrap Token (JSON):
      </label>
      <textarea class="nv-popup-textarea" id="token-input" placeholder='{"tokenId":"...","publicKey":"...","signature":"...","expiresAt":"..."}'></textarea>
      <button class="nv-popup-btn" id="save-token" type="button">Save Token</button>
      <button class="nv-popup-btn danger" id="clear-token" type="button">Clear Saved Token</button>
    </div>

    <div class="nv-popup-hint">Local-first encrypted · Zero cloud middlemen</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
